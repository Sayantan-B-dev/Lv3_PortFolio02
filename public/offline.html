<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10101a" />
    <title>Offline - Aura overloaded</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Georgia, "Times New Roman", serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #10101a;
        color: #f6ebdd;
      }
      main {
        width: min(26rem, 100%);
        padding: 2rem;
        text-align: center;
        border: 1px solid rgb(201 155 82 / 35%);
        border-radius: 0.5rem;
        background: rgb(246 235 221 / 4%);
        box-shadow: 0 2rem 5rem -2rem #000;
      }
      p {
        margin: 0 0 1.5rem;
        color: rgb(246 235 221 / 70%);
        line-height: 1.6;
      }
      h1 {
        margin: 0 0 0.75rem;
        color: #c99b52;
        font-size: 1.6rem;
        font-weight: 400;
      }
      button {
        min-height: 2.75rem;
        padding: 0.6rem 1.2rem;
        border: 1px solid #c99b52;
        border-radius: 0.375rem;
        background: rgb(201 155 82 / 14%);
        color: #f6ebdd;
        font: inherit;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:hover {
        background: rgb(201 155 82 / 24%);
      }
      button:focus-visible {
        outline: 2px solid #f6ebdd;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        The rooms you have already opened are cached. Reconnect, then reload to
        continue where you left off.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
